name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python test_tools.py


ui-build:
  runs-on: ubuntu-latest
  defaults:
    run:
      working-directory: resale-ui
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: resale-ui/package-lock.json
   - run: npm ci
   - run: npm run lint
   - run: npm run build
